<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101735">
<title>별과 우주 시험 대비</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root{
    --bg:#101735; --bg2:#18224a; --panel:#ffffff; --ink:#1f2540; --sub:#6a7192;
    --line:#e3e6f2; --soft:#f3f5fb; --gold:#ffc83d; --o:#2f7cf6; --x:#f0525a;
    --ok:#1fa971; --ng:#e5484d; --accent:#7c5cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:#fff;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
    touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 40% 32%,#cfd8ff,transparent),radial-gradient(1px 1px at 88% 44%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 22% 68%,#fff,transparent),radial-gradient(1px 1px at 60% 78%,#cfd8ff,transparent),
    radial-gradient(1.2px 1.2px at 92% 88%,#fff,transparent),radial-gradient(1px 1px at 6% 92%,#fff,transparent);}
  #app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;}
  button{font-family:inherit;border:0;cursor:pointer;}
  .hide{display:none!important;}

  /* 홈 */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .brand{font-size:13px;color:#aab3e0;letter-spacing:.04em;}
  .dday{background:var(--x);color:#fff;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;}
  h1{font-size:26px;line-height:1.25;margin:6px 0 4px;font-weight:800;letter-spacing:-.01em;}
  .lead{color:#aab3e0;font-size:14px;margin:0 0 14px;}
  .summary{display:flex;gap:10px;margin-bottom:16px;}
  .summary div{flex:1;background:var(--bg2);border-radius:14px;padding:10px 12px;}
  .summary b{display:block;font-size:20px;color:var(--gold);}
  .summary span{font-size:12px;color:#aab3e0;}
  .name{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:14px;padding:8px 12px;margin-bottom:16px;}
  .name label{font-size:13px;color:#aab3e0;white-space:nowrap;}
  .name input{flex:1;background:transparent;border:0;border-bottom:1px solid #3a4680;color:#fff;font-size:16px;padding:4px 2px;font-family:inherit;outline:none;}
  .stage{background:var(--panel);color:var(--ink);border-radius:20px;padding:14px 14px 10px;margin-bottom:14px;position:relative;}
  .stage-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .planet{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12);}
  .stage-h b{font-size:17px;display:block;}
  .stage-h small{font-size:12px;color:var(--sub);}
  .mode{display:flex;align-items:center;width:100%;background:var(--soft);border-radius:14px;padding:13px 14px;margin-bottom:8px;
    font-size:16px;font-weight:700;color:var(--ink);text-align:left;min-height:54px;}
  .mode .ic{font-size:20px;width:30px;}
  .mode .nm{flex:1;}
  .mode .st{font-size:15px;letter-spacing:1px;color:#d5d9e8;}
  .mode .st i{font-style:normal;color:var(--gold);}
  .boss{background:linear-gradient(135deg,#7c5cff,#2f7cf6);color:#fff;}
  .boss .mode{background:rgba(255,255,255,.16);color:#fff;}
  .boss .stage-h small{color:#e2e0ff;}
  .boss .mode .st{color:rgba(255,255,255,.4);}
  .wrongbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--bg2);color:#fff;border-radius:16px;
    padding:15px 16px;font-size:16px;font-weight:700;margin-bottom:14px;min-height:54px;}
  .wrongbtn span{background:var(--x);border-radius:999px;font-size:13px;padding:3px 10px;}
  .foot{text-align:center;font-size:12px;color:#7480b8;margin-top:auto;padding-top:10px;}

  /* 문제 화면 */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .close{width:40px;height:40px;border-radius:12px;background:var(--bg2);color:#fff;font-size:20px;flex:none;}
  .qtitle{flex:1;font-size:15px;font-weight:700;}
  .qtitle small{display:block;font-size:12px;color:#aab3e0;font-weight:500;}
  .pill{background:var(--bg2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap;}
  .pill.combo{background:var(--gold);color:#3a2a00;}
  .prog{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-bottom:8px;}
  .prog i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s;}
  .timer{height:8px;background:#2a335e;border-radius:6px;overflow:hidden;margin-bottom:12px;}
  .timer i{display:block;height:100%;background:linear-gradient(90deg,#1fa971,#ffc83d,#f0525a);background-size:300% 100%;border-radius:6px;}
  .qcard{background:var(--panel);color:var(--ink);border-radius:22px;padding:22px 18px;font-size:19px;line-height:1.6;font-weight:600;
    word-break:keep-all;min-height:160px;display:flex;flex-direction:column;justify-content:center;}
  .qcard .tag{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;}
  .qcard table{border-collapse:collapse;margin:10px 0 0;font-size:15px;width:100%;}
  .qcard th,.qcard td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  .qcard th{background:var(--soft);font-weight:700;}
  .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 3px;height:1.2em;vertical-align:-.15em;}
  .filled{color:var(--accent);font-weight:800;border-bottom:3px solid var(--accent);padding:0 3px;}
  .bogi{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7;margin-top:10px;font-weight:500;}
  .spacer{flex:1;min-height:14px;}
  .actions{display:flex;flex-direction:column;gap:10px;padding-top:14px;}
  .oxrow{display:flex;gap:12px;}
  .oxbtn{flex:1;height:110px;border-radius:24px;font-size:56px;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);}
  .oxbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .oxbtn.o{background:var(--o);} .oxbtn.x{background:var(--x);}
  .opt{width:100%;background:var(--panel);color:var(--ink);border-radius:16px;padding:14px 16px;font-size:16px;font-weight:600;
    text-align:left;line-height:1.45;min-height:54px;display:flex;gap:10px;align-items:flex-start;border:3px solid transparent;}
  .opt b{color:var(--accent);}
  .opt.right{border-color:var(--ok);background:#e9f8f1;}
  .opt.wrong{border-color:var(--ng);background:#fdeced;}
  .opt:disabled{opacity:1;}
  .big{width:100%;min-height:56px;border-radius:16px;font-size:17px;font-weight:800;background:var(--gold);color:#3a2a00;}
  .big.ghost{background:var(--bg2);color:#fff;}
  .big.ok{background:var(--ok);color:#fff;} .big.ng{background:var(--ng);color:#fff;}
  .row2{display:flex;gap:10px;} .row2 .big{flex:1;}
  .fb{border-radius:18px;padding:14px 16px;margin-top:12px;font-size:15px;line-height:1.6;word-break:keep-all;}
  .fb.good{background:#e9f8f1;color:#0e5a3b;} .fb.bad{background:#fdeced;color:#7a1d22;}
  .fb b{font-size:17px;display:block;margin-bottom:2px;}
  .pop{animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
  .shake{animation:shake .35s;}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* 결과 */
  .result{background:var(--panel);color:var(--ink);border-radius:24px;padding:24px 18px;text-align:center;}
  .result .stars{font-size:46px;letter-spacing:6px;color:#dde1ee;margin:4px 0 6px;}
  .result .stars i{font-style:normal;color:var(--gold);}
  .result h2{margin:0 0 4px;font-size:22px;}
  .result .score{font-size:40px;font-weight:900;color:var(--accent);margin:6px 0;}
  .result .meta{font-size:13px;color:var(--sub);line-height:1.6;}
  .rlist{text-align:left;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
  .rlist div{font-size:14px;line-height:1.5;padding:8px 0;border-bottom:1px dashed var(--line);word-break:keep-all;}
  .rlist em{font-style:normal;color:var(--ok);font-weight:700;}
  .capture{font-size:12px;color:#aab3e0;text-align:center;margin:10px 0 0;}

  /* 오답 노트 */
  .wcard{background:var(--panel);color:var(--ink);border-radius:16px;padding:14px;margin-bottom:10px;font-size:15px;line-height:1.55;word-break:keep-all;}
  .wcard small{color:var(--accent);font-weight:700;font-size:12px;}
  .wcard .ans{margin-top:6px;color:var(--ok);font-weight:700;}
  .wcard .exp{color:var(--sub);font-size:14px;margin-top:2px;}
  .empty{text-align:center;color:#aab3e0;padding:40px 0;font-size:15px;line-height:1.7;}
  textarea{width:100%;min-height:96px;border-radius:14px;border:2px solid var(--line);padding:10px 12px;font-size:16px;font-family:inherit;margin-top:10px;resize:vertical;}
</style>
</head>

const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  const opts=shuffle(set);
  return Object.assign({type:"mcq", id:"calc-"+Date.now()+"-"+Math.random().toString(36).slice(2,7), q, opts, a:opts.indexOf(correct), exp, calc:true}, extra||{});
}

  const d=pick([1,2,5,5,10]); const m1=Math.floor(Math.random()*7)-3; const m2=m1+d;
  if(Math.random()<.25) return mcqFrom(`${sg(m1)}등급 별과 ${sg(m2)}등급 별 중 더 밝게 보이는 별은?`, `${sg(m1)}등급 별`, [`${sg(m2)}등급 별`,"두 별의 밝기가 같다","알 수 없다"], `등급 숫자가 작을수록 밝아요 → ${sg(m1)}등급`,{tag:"등급과 밝기"});
  return mcqFrom(`${sg(m1)}등급 별은 ${sg(m2)}등급 별보다 몇 배 밝게 보일까?`, MAGX[d], Object.values(MAGX).concat([`${d}배`,`${d*2}배`]).filter(x=>x!==MAGX[d]), `${sg(m2)} − (${sg(m1)}) = ${d}등급 차이 → ${MAGX[d]}`+(d===2?" (2.5 × 2.5)":d===10?" (100 × 100)":""),{tag:"등급과 밝기"});
}
function genAbs(){
  if(Math.random()<.5){
    const kind=pick(["near","eq","far"]); const M=Math.round((Math.random()*10-4)*10)/10;
    let m = kind==="eq"?M : kind==="near"? Math.round((M-(0.5+Math.random()*5))*10)/10 : Math.round((M+(0.5+Math.random()*5))*10)/10;
    const ans = {near:"10 pc보다 가깝다",eq:"10 pc 거리에 있다",far:"10 pc보다 멀다"}[kind];
    return mcqFrom(`어떤 별의 겉보기 등급은 ${sg(m)}, 절대 등급은 ${sg(M)}이에요. 이 별은?`, ans, ["10 pc보다 가깝다","10 pc 거리에 있다","10 pc보다 멀다","알 수 없다"].filter(x=>x!==ans), `겉보기 − 절대 = ${sg(Math.round((m-M)*10)/10)} → ${kind==="near"?"0보다 작으니 가깝다":kind==="eq"?"0이니 10 pc":"0보다 크니 멀다"}`,{tag:"겉보기·절대 등급"});
  }
  let st;
  do{ st=["A","B","C"].map(n=>({n,m:Math.floor(Math.random()*12)-4,M:Math.floor(Math.random()*12)-6})); }
  while(new Set(st.map(s=>s.m)).size<3||new Set(st.map(s=>s.M)).size<3||new Set(st.map(s=>s.m-s.M)).size<3);
  const ask=pick([["가장 밝게 보이는 별",s=>s.m,"min","겉보기 등급이 가장 작은 별"],["실제로 가장 밝은 별",s=>s.M,"min","절대 등급이 가장 작은 별"],["가장 멀리 있는 별",s=>s.m-s.M,"max","(겉보기 − 절대)가 가장 큰 별"],["가장 가까이 있는 별",s=>s.m-s.M,"min","(겉보기 − 절대)가 가장 작은 별"]]);
  const sorted=[...st].sort((x,y)=>ask[1](x)-ask[1](y)); const ans=(ask[2]==="min"?sorted[0]:sorted[2]).n;
  const tbl=`<table><tr><th>별</th><th>겉보기 등급</th><th>절대 등급</th></tr>${st.map(s=>`<tr><td>${s.n}</td><td>${sg(s.m)}</td><td>${sg(s.M)}</td></tr>`).join("")}</table>`;
  return mcqFrom(`표에서 ${ask[0]}은?${tbl}`, "별 "+ans, ["별 A","별 B","별 C"].filter(x=>x!=="별 "+ans).concat(["세 별이 모두 같다"]), `${ask[3]} → ${ans}`+(ask[2]&&ask[0].includes("멀")||ask[0].includes("가까")?` (A ${sg(st[0].m-st[0].M)}, B ${sg(st[1].m-st[1].M)}, C ${sg(st[2].m-st[2].M)})`:""),{tag:"겉보기·절대 등급"});
}

/* ===================== 저장 ===================== */
const KEY="starquiz-v1";
let S; try{ S=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ S={}; }
S.stars=S.stars||{}; S.wrong=S.wrong||{}; S.name=S.name||"";
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const addWrong=it=>{ S.wrong[it.id]=Object.assign({},it,{at:Date.now()}); save(); };
const delWrong=id=>{ delete S.wrong[id]; save(); };
const starHtml=n=>"★★★".split("").map((s,i)=>i<n?`<i>★</i>`:"★").join("");
const starsFor=r=>r>=1?3:r>=.8?2:r>=.6?1:0;

/* ===================== 화면 ===================== */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let TIMER=null; const stopTimer=()=>{ if(TIMER){cancelAnimationFrame(TIMER);TIMER=null;} };

function home(){
  stopTimer(); window.scrollTo(0,0);
  const days=Math.ceil((EXAM_DATE-new Date(new Date().toDateString()))/86400000);
  const dd = days>0?`시험 D-${days}`: days===0?"오늘 시험! 파이팅":"";
  const total=Object.values(S.stars).reduce((a,b)=>a+b,0);
  const nWrong=Object.keys(S.wrong).length;
  const modeBtn=(key,ic,nm)=>`<button class="mode" data-go="${key}"><span class="ic">${ic}</span><span class="nm">${nm}</span><span class="st">${starHtml(S.stars[key]||0)}</span></button>`;
  app.innerHTML=`
  <div class="top"><span class="brand">소소숲 · 중2 과학</span>${dd?`<span class="dday">${dd}</span>`:""}</div>
  <h1>별과 우주<br>시험 대비 게임</h1>
  <p class="lead">스테이지마다 별 3개를 모아 보세요.</p>
  <div class="summary"><div><b>★ ${total}</b><span>모은 별 / 24</span></div><div><b>${nWrong}</b><span>오답 노트 문제</span></div></div>
  <div class="name"><label>내 이름</label><input id="nm" maxlength="12" placeholder="결과 화면에 나와요" value="${esc(S.name)}"></div>
  ${STAGES.map((s,i)=>`<div class="stage"><div class="stage-h"><div class="planet" style="background:${s.color}"></div><div><b>${i+1}. ${s.name}</b><small>${s.sub}</small></div></div>
    ${modeBtn(s.id+"-card","🃏","개념 카드")}${modeBtn(s.id+"-ox","⚡","OX 스피드")}${s.id==="s1"?modeBtn("calc","🧮","계산 챌린지"):""}</div>`).join("")}
  <div class="stage boss"><div class="stage-h"><div class="planet" style="background:radial-gradient(circle at 35% 35%,#fff3c4,#ffb020)"></div><div><b>보스. 실전 모의고사</b><small>객관식 12 + 서술형 4</small></div></div>${modeBtn("exam","🏆","실전 모의고사")}</div>
  <button class="wrongbtn" data-go="wrong">📒 오답 노트 <span>${nWrong}문제</span></button>
  <div class="foot">소소숲 · @sososoop_notes<br>기록은 이 폰에만 저장돼요</div>`;
  app.querySelector("#nm").addEventListener("input",e=>{S.name=e.target.value.trim();save();});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function go(key){
  if(key==="wrong") return wrongNote();
  if(key==="calc"){ const gens=shuffle([genParallax,genParallax,genParallax,genBright,genBright,genMag,genMag,genMag,genAbs,genAbs]); return runQuiz({key,title:"계산 챌린지",sub:"별의 특성",items:gens.map(g=>g())}); }
  if(key==="exam") return runQuiz({key,title:"실전 모의고사",sub:"객관식 12문제",items:EXAM.map((e,i)=>Object.assign({type:"mcq",id:"exam-"+i,tag:`${i+1}번`},e)),noShuffle:true,then:essays});
  const [sid,mode]=key.split("-"); const st=STAGES.find(s=>s.id===sid);
  if(mode==="card") return runQuiz({key,title:"개념 카드",sub:st.name,items:shuffle(CARDS[sid].map((c,i)=>({type:"card",id:`${sid}-c${i}`,q:c[0],ans:c[1],tag:st.name})))});
  if(mode==="ox") return runQuiz({key,title:"OX 스피드",sub:st.name,timer:10,items:shuffle(OX[sid].map((o,i)=>({type:"ox",id:`${sid}-o${i}`,q:o[0],a:o[1],exp:o[2],tag:st.name}))).slice(0,10)});
}

function runQuiz(cfg){
  const items=cfg.items; let idx=0, right=0, score=0, combo=0; const log=[];
  const next=()=>{ idx++; if(idx<items.length) show(); else finish(); };
  function header(){
    return `<div class="qhead"><button class="close" id="cl">✕</button><div class="qtitle">${cfg.title}<small>${cfg.sub||""}</small></div>
      ${cfg.timer?`<span class="pill ${combo>=2?"combo":""}">${combo>=2?"🔥"+combo+" 콤보":score+"점"}</span>`:`<span class="pill">${idx+1} / ${items.length}</span>`}</div>
      <div class="prog"><i style="width:${idx/items.length*100}%"></i></div>${cfg.timer?`<div class="timer"><i id="tb" style="width:100%"></i></div>`:""}`;
  }
  function bindClose(){ app.querySelector("#cl").onclick=()=>{ stopTimer(); cfg.review?wrongNote():home(); }; }
  function record(it, ok, given){
    log.push({it,ok,given});
    if(ok){ right++; combo++; score+=100+(cfg.timer?Math.max(0,combo-1)*20:0); if(cfg.review) delWrong(it.id); }
    else { combo=0; addWrong(it); }
  }
  function show(){
    stopTimer(); window.scrollTo(0,0);
    const it=items[idx]; const tag=it.tag?`<div class="tag">${it.tag}</div>`:"";
    if(it.type==="card"){
      const qh=esc(it.q).replace("___",'<span class="blank" id="bl"></span>');
      app.innerHTML=header()+`<div class="qcard pop">${tag}<div>${qh}</div></div><div class="spacer"></div>
        <div class="actions" id="act"><button class="big" id="rv">정답 보기</button></div>`;
      bindClose();
      app.querySelector("#rv").onclick=()=>{
        app.querySelector("#bl").outerHTML=`<span class="filled">${esc(it.ans)}</span>`;
        app.querySelector("#act").innerHTML=`<div class="row2"><button class="big ng" id="no">몰랐어요</button><button class="big ok" id="yes">알았어요</button></div>`;
        app.querySelector("#no").onclick=()=>{record(it,false);next();};
        app.querySelector("#yes").onclick=()=>{record(it,true);next();};
      };
      return;
    }
    if(it.type==="ox"){
      app.innerHTML=header()+`<div class="qcard pop">${tag}<div>${esc(it.q)}</div></div><div id="fbw"></div><div class="spacer"></div>
        <div class="actions" id="act"><div class="oxrow"><button class="oxbtn o" data-v="1">O</button><button class="oxbtn x" data-v="0">X</button></div></div>`;
      bindClose();
      const answer=v=>{ stopTimer(); const ok=(v===it.a); record(it,ok,v);
        feedback(ok, ok?"정답!":(v===null?"시간 초과!":"아쉬워요!"), `정답은 <b style="display:inline;font-size:inherit">${it.a?"O":"X"}</b> · ${esc(it.exp)}`); };
      app.querySelectorAll(".oxbtn").forEach(b=>b.onclick=()=>answer(b.dataset.v==="1"));
      if(cfg.timer) startTimer(cfg.timer,()=>answer(null));
      return;
    }
    // mcq
    const bogi=it.bogi?`<div class="bogi">${it.bogi}</div>`:"";
    app.innerHTML=header()+`<div class="qcard pop" style="font-size:17px">${tag}<div>${it.q}</div>${bogi}</div><div id="fbw"></div><div class="spacer"></div>
      <div class="actions" id="act">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${"①②③④⑤"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>`;
    bindClose();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const v=+b.dataset.i, ok=v===it.a; record(it,ok,v);
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const i=+x.dataset.i; if(i===it.a)x.classList.add("right"); else if(i===v)x.classList.add("wrong");});
      feedback(ok, ok?"정답!":"아쉬워요!", esc(it.exp||""), true);
    });
  }
  function feedback(ok,head,body,keepOpts){
    const w=app.querySelector("#fbw");
    w.innerHTML=`<div class="fb ${ok?"good":"bad"} pop"><b>${ok?"⭕ ":"❌ "}${head}</b>${body}</div>`;
    if(!ok) app.querySelector(".qcard").classList.add("shake");
    const act=app.querySelector("#act");
    if(!keepOpts) act.innerHTML="";
    const nb=document.createElement("button"); nb.className="big"; nb.textContent=idx+1<items.length?"다음 문제":"결과 보기"; nb.onclick=next;
    act.appendChild(nb);
    // 헤더 점수 갱신
    const pill=app.querySelector(".pill"); if(pill&&cfg.timer){ pill.className="pill "+(combo>=2?"combo":""); pill.textContent=combo>=2?"🔥"+combo+" 콤보":score+"점"; }
    setTimeout(()=>nb.isConnected&&nb.scrollIntoView({behavior:"smooth",block:"end"}),60);
  }
  function startTimer(sec,onEnd){
    const t0=performance.now(); const bar=app.querySelector("#tb");
    const tick=now=>{ const r=Math.max(0,1-(now-t0)/(sec*1000)); bar.style.width=(r*100)+"%"; bar.style.backgroundPosition=`${(1-r)*100}% 0`;
      if(r<=0){ TIMER=null; onEnd(); } else TIMER=requestAnimationFrame(tick); };
    TIMER=requestAnimationFrame(tick);
  }
  function finish(){
    if(cfg.then) return cfg.then({right,total:items.length,log});
    result({cfg,right,total:items.length,score:cfg.timer?score:0,log});
  }
  show();
}

function essays(prev){
  let i=0, right=prev.right; const log=prev.log.slice();
  function show(){
    window.scrollTo(0,0);
    const e=ESSAYS[i];
    app.innerHTML=`<div class="qhead"><button class="close" id="cl">✕</button><div class="qtitle">실전 모의고사<small>서술형 ${13+i}번 · 스스로 채점</small></div><span class="pill">${i+1} / 4</span></div>
      <div class="prog"><i style="width:${i/4*100}%"></i></div>
      <div class="qcard pop" style="font-size:17px"><div class="tag">${13+i}번 서술형</div><div>${esc(e.q)}</div>
      <textarea id="ta" placeholder="여기에 답을 써 보세요 (종이에 써도 돼요)"></textarea></div>
      <div id="fbw"></div><div class="spacer"></div><div class="actions" id="act"><button class="big" id="rv">예시 답안 보기</button></div>`;
    app.querySelector("#cl").onclick=home;
    app.querySelector("#rv").onclick=()=>{
      app.querySelector("#fbw").innerHTML=`<div class="fb good pop" style="background:#eef0ff;color:#2b2f55"><b>예시 답안</b>${esc(e.ex)}<div style="margin-top:8px;font-weight:700;color:#7c5cff">✔ ${esc(e.pt)}</div></div>`;
      app.querySelector("#act").innerHTML=`<div class="row2"><button class="big ng" id="no">빠졌어요</button><button class="big ok" id="yes">들어갔어요</button></div>`;
      const it={type:"essay",id:"essay-"+i,q:e.q,ex:e.ex,tag:`${13+i}번 서술형`};
      app.querySelector("#no").onclick=()=>{ addWrong(it); log.push({it,ok:false}); step(); };
      app.querySelector("#yes").onclick=()=>{ right++; delWrong(it.id); log.push({it,ok:true}); step(); };
      setTimeout(()=>app.querySelector("#act")?.scrollIntoView({behavior:"smooth",block:"end"}),60);
    };
  }
  const step=()=>{ i++; if(i<ESSAYS.length) show(); else result({cfg:{key:"exam",title:"실전 모의고사",sub:"객관식 12 + 서술형 4"},right,total:16,log}); };
  show();
}

function result({cfg,right,total,score,log}){
  stopTimer(); window.scrollTo(0,0);
  const st=starsFor(right/total);
  if(!cfg.review){ S.stars[cfg.key]=Math.max(S.stars[cfg.key]||0,st); save(); }
  const msg=st===3?"완벽해요!":st===2?"거의 다 왔어요!":st===1?"좋아요, 한 번 더!":"오답 노트로 복습해요";
  const now=new Date(); const when=`${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const wrongs=log.filter(l=>!l.ok);
  app.innerHTML=`<div class="result pop">
    <div class="stars">${starHtml(st)}</div><h2>${msg}</h2>
    <div class="score">${right} / ${total}</div>
    ${score?`<div class="meta">점수 ${score}점</div>`:""}
    <div class="meta">${esc(cfg.title)} · ${esc(cfg.sub||"")}<br>${S.name?esc(S.name)+" · ":""}${when}</div>
    ${wrongs.length?`<div class="rlist">${wrongs.map(l=>`<div>❌ ${l.it.type==="card"?esc(l.it.q).replace("___","<em>"+esc(l.it.ans)+"</em>"):(l.it.q.length>60?esc(l.it.q.replace(/<[^>]+>/g," ").slice(0,60))+"…":l.it.q.replace(/<table[\s\S]*<\/table>/,""))}<br><em>${answerText(l.it)}</em></div>`).join("")}</div>`:""}
  </div>
  <p class="capture">📸 이 화면을 캡처해서 선생님께 보내 주세요</p>
  <div class="actions"><button class="big" id="again">다시 하기</button><button class="big ghost" id="hm">처음으로</button></div>`;
  app.querySelector("#again").onclick=()=>cfg.review?wrongNote():go(cfg.key);
  app.querySelector("#hm").onclick=home;
}
function answerText(it){
  if(it.type==="ox") return "정답 "+(it.a?"O":"X")+" · "+esc(it.exp);
  if(it.type==="mcq") return "정답 "+"①②③④⑤"[it.a]+" "+esc(it.opts[it.a])+(it.exp?" · "+esc(it.exp):"");
  if(it.type==="card") return "정답 "+esc(it.ans);
  if(it.type==="essay") return "예시 답안: "+esc(it.ex);
  return "";
}

function wrongNote(){
  stopTimer(); window.scrollTo(0,0);
  const list=Object.values(S.wrong).sort((a,b)=>b.at-a.at);
  app.innerHTML=`<div class="qhead"><button class="close" id="cl">✕</button><div class="qtitle">오답 노트<small>다시 맞히면 노트에서 빠져요</small></div><span class="pill">${list.length}문제</span></div>
    ${list.length?`<div class="actions" style="padding:0 0 12px"><button class="big" id="re">오답만 다시 풀기</button></div>`+
      list.map(it=>`<div class="wcard"><small>${esc(it.tag||"")}</small><div>${it.type==="card"?esc(it.q).replace("___","____"):it.q.replace(/<table[\s\S]*<\/table>/," (표 문제)")}</div><div class="ans">${answerText(it)}</div></div>`).join("")
      :`<div class="empty">오답 노트가 비어 있어요.<br>문제를 풀다 틀리면 여기 모여요.</div>`}
    <div class="foot">소소숲 · @sososoop_notes</div>`;
  app.querySelector("#cl").onclick=home;
  const re=app.querySelector("#re");
  if(re) re.onclick=()=>{
    const items=shuffle(list.filter(i=>i.type!=="essay")).slice(0,15);
    const ess=list.filter(i=>i.type==="essay");
    if(!items.length){ alert("서술형은 실전 모의고사에서 다시 풀어 보세요."); return; }
    runQuiz({key:"wrong",title:"오답 다시 풀기",sub:`${items.length}문제`+(ess.length?` (서술형 ${ess.length}개는 모의고사에서)`:""),items,review:true});
  };
}

home();
</script>
